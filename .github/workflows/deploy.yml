name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Build and test PRs too; only pushes to main deploy.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Deploys queue in one group; each PR gets its own so it never waits on one.
  group: ${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: false

# Not withastro/action: it installs with `npm install`, which rewrites a
# lockfile that has drifted instead of failing the way `npm ci` does.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Check SEO invariants
        run: npm test

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./dist"

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Only this job publishes, so only it can write to Pages.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
